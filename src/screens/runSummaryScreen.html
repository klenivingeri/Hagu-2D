<div class="run-summary-screen fixed inset-0 z-40 flex items-center justify-center overflow-y-auto bg-gray-950/90 px-4 py-6 text-center text-white backdrop-blur-sm">
  <div class="run-summary-panel rounded-3xl border border-white/10 bg-gradient-to-b from-gray-900/95 to-gray-950/95 p-5 shadow-2xl shadow-black/50">
    <div class="run-summary-area-header flex flex-col items-center justify-center gap-2">
      <span class="text-xs uppercase tracking-widest text-emerald-400">Fase concluída</span>
      <h1 class="run-summary-unlocked text-xl font-extrabold leading-tight">Próxima fase liberada</h1>
      <div class="run-summary-stars flex items-center gap-2 text-3xl leading-none"></div>
    </div>

    <div class="run-summary-area-stats grid grid-cols-4 gap-2">
      <div class="run-summary-card flex flex-col items-center gap-1 rounded-xl border border-white/10 bg-gray-900/70 py-3">
        <span class="text-2xl">✨</span>
        <span class="run-summary-exp text-lg font-bold">0</span>
        <span class="text-[10px] uppercase text-gray-400">Exp</span>
      </div>
      <div class="run-summary-card flex flex-col items-center gap-1 rounded-xl border border-white/10 bg-gray-900/70 py-3">
        <span class="text-2xl">🪙</span>
        <span class="run-summary-coins text-lg font-bold">0</span>
        <span class="text-[10px] uppercase text-gray-400">Moedas</span>
      </div>
      <div class="run-summary-card flex flex-col items-center gap-1 rounded-xl border border-white/10 bg-gray-900/70 py-3">
        <span class="text-2xl">💎</span>
        <span class="run-summary-diamonds text-lg font-bold">0</span>
        <span class="text-[10px] uppercase text-gray-400">Diamantes</span>
      </div>
      <div class="run-summary-card flex flex-col items-center gap-1 rounded-xl border border-white/10 bg-gray-900/70 py-3">
        <span class="text-2xl">⏱️</span>
        <span class="run-summary-time text-lg font-bold">0:00</span>
        <span class="text-[10px] uppercase text-gray-400">Tempo</span>
      </div>
    </div>

    <div class="run-summary-area-lists flex flex-col gap-2 overflow-y-auto">
      <div class="run-summary-monsters-wrap hidden w-full flex-col items-center gap-2 rounded-xl border border-white/10 bg-gray-900/70 px-3 py-3">
        <span class="text-[10px] uppercase text-gray-400">Monstros derrotados</span>
        <div class="run-summary-monsters flex flex-wrap items-start justify-center gap-3"></div>
      </div>

      <div class="run-summary-sprites-wrap hidden w-full flex-col items-center gap-2 rounded-xl border border-amber-400/30 bg-amber-500/10 px-3 py-3">
        <span class="text-[10px] uppercase text-amber-300">Novo na Coleção!</span>
        <div class="run-summary-sprites flex flex-wrap items-start justify-center gap-3"></div>
      </div>
    </div>

    <div class="run-summary-area-footer flex justify-center">
      <button type="button" class="run-summary-back-btn rounded-full bg-emerald-500 px-10 py-3 text-sm font-extrabold uppercase tracking-wide text-gray-950 shadow-lg transition-transform active:scale-95">
        Voltar pro Início
      </button>
    </div>
  </div>
</div>
