<div class="settings-screen fixed inset-0 z-40 flex items-center justify-center bg-black/60 px-4 text-white">
  <div class="w-full max-w-xs rounded-xl bg-gray-900 p-4 shadow-xl">
    <div class="mb-3 flex items-center justify-between">
      <h2 class="text-base font-bold">Configurações</h2>
      <button type="button" class="settings-close-btn text-xl leading-none text-gray-400" aria-label="Fechar">×</button>
    </div>

    <div class="settings-tabbar mb-3 flex shrink-0 gap-2">
      <button type="button" class="settings-tab-btn settings-tab-active flex-1 rounded-lg border border-emerald-400 bg-emerald-500/10 py-1.5 text-xs font-bold text-emerald-400" data-tab="general">Geral</button>
      <button type="button" class="settings-tab-btn flex-1 rounded-lg border border-white/15 bg-gray-900/60 py-1.5 text-xs font-bold text-gray-400" data-tab="buttons">Botões</button>
      <button type="button" class="settings-tab-btn flex-1 rounded-lg border border-white/15 bg-gray-900/60 py-1.5 text-xs font-bold text-gray-400" data-tab="layout">Layout</button>
    </div>

    <div class="settings-tab-panel flex flex-col gap-3" data-tab="general">
      <label class="flex items-center justify-between gap-3 text-sm">
        <span>Vibração</span>
        <input type="checkbox" class="setting-toggle h-5 w-5 accent-emerald-500" data-setting="vibrationEnabled" />
      </label>
      <label class="flex items-center justify-between gap-3 text-sm">
        <span>Som do jogo</span>
        <input type="checkbox" class="setting-toggle h-5 w-5 accent-emerald-500" data-setting="soundEnabled" />
      </label>
      <label class="fullscreen-setting-row flex items-center justify-between gap-3 text-sm">
        <span>Tela cheia</span>
        <input type="checkbox" class="fullscreen-toggle h-5 w-5 accent-emerald-500" />
      </label>

      <div class="visual-filter-row flex flex-col gap-2 text-sm">
        <span class="whitespace-nowrap">Filtro de tela</span>
        <div class="visual-filter-group flex w-full shrink-0 overflow-hidden rounded-lg border border-white/15">
          <button type="button" class="visual-filter-btn flex-1 px-2 py-1 text-[10px] font-bold text-center" data-filter="none">Normal</button>
          <button type="button" class="visual-filter-btn flex-1 border-l border-white/15 px-2 py-1 text-[10px] font-bold text-center" data-filter="colorblind">Daltônico</button>
          <button type="button" class="visual-filter-btn flex-1 border-l border-white/15 px-2 py-1 text-[10px] font-bold text-center" data-filter="gameboy">Game Boy</button>
        </div>
      </div>


    </div>

    <div class="settings-tab-panel hidden grid grid-cols-2 gap-2" data-tab="buttons">
      <button type="button" class="controls-theme-btn rounded-lg border border-white/15 bg-gray-900/60 p-2" data-theme="default">
        <span class="controls-theme-preview" data-theme-option="default">
          <span class="preview-btn">A</span>
          <span class="preview-btn">B</span>
        </span>
      </button>
      <button type="button" class="controls-theme-btn rounded-lg border border-white/15 bg-gray-900/60 p-2" data-theme="iphone">
        <span class="controls-theme-preview" data-theme-option="iphone">
          <span class="preview-btn">A</span>
          <span class="preview-btn">B</span>
        </span>
      </button>
      <button type="button" class="controls-theme-btn rounded-lg border border-white/15 bg-gray-900/60 p-2" data-theme="gameboy">
        <span class="controls-theme-preview" data-theme-option="gameboy">
          <span class="preview-btn">A</span>
          <span class="preview-btn">B</span>
        </span>
      </button>
      <button type="button" class="controls-theme-btn rounded-lg border border-white/15 bg-gray-900/60 p-2" data-theme="nintendo">
        <span class="controls-theme-preview" data-theme-option="nintendo">
          <span class="preview-btn">A</span>
          <span class="preview-btn">B</span>
        </span>
      </button>
      <button type="button" class="controls-theme-btn rounded-lg border border-white/15 bg-gray-900/60 p-2" data-theme="switch">
        <span class="controls-theme-preview" data-theme-option="switch">
          <span class="preview-btn">A</span>
          <span class="preview-btn">B</span>
        </span>
      </button>
      <button type="button" class="controls-theme-btn rounded-lg border border-white/15 bg-gray-900/60 p-2" data-theme="neon">
        <span class="controls-theme-preview" data-theme-option="neon">
          <span class="preview-btn">A</span>
          <span class="preview-btn">B</span>
        </span>
      </button>
    </div>

    <div class="settings-tab-panel hidden flex flex-col gap-3" data-tab="layout">
      <span class="text-sm">Layout dos controles</span>
      <div class="platform-mode-group flex w-full shrink-0 overflow-hidden rounded-lg border border-white/15">
        <button type="button" class="platform-mode-btn flex-1 px-3 py-1 text-xs font-bold text-center" data-platform="mobile">Mobile</button>
        <button type="button" class="platform-mode-btn flex-1 border-l border-white/15 px-3 py-1 text-xs font-bold text-center" data-platform="gameboy">Game Boy</button>
      </div>
    </div>

    <div class="mt-4 flex flex-col gap-3 border-t border-white/10 pt-4">
      <button type="button" class="settings-back-btn rounded-full border border-white/20 bg-gray-900/70 px-10 py-3 text-sm font-extrabold uppercase tracking-wide text-white shadow-lg transition-transform active:scale-95">
        Voltar pro mapa
      </button>
      <button type="button" class="settings-resume-btn rounded-full bg-emerald-500 px-10 py-3 text-sm font-extrabold uppercase tracking-wide text-gray-950 shadow-lg transition-transform active:scale-95">
        Continuar
      </button>
    </div>
  </div>
</div>
