<div class="settings-screen fixed inset-0 z-40 flex items-center justify-center bg-black/60 px-4 text-white">
  <div class="w-full max-w-xs rounded-xl bg-gray-900 p-4 shadow-xl">
    <div class="mb-3 flex items-center justify-between">
      <h2 class="text-base font-bold">Configurações</h2>
      <button type="button" class="settings-close-btn text-xl leading-none text-gray-400" aria-label="Fechar">×</button>
    </div>

    <div class="flex flex-col gap-3">
      <label class="flex items-center justify-between gap-3 text-sm">
        <span>Vibração</span>
        <input type="checkbox" class="setting-toggle h-5 w-5 accent-emerald-500" data-setting="vibrationEnabled" />
      </label>
      <label class="flex items-center justify-between gap-3 text-sm">
        <span>Som do jogo</span>
        <input type="checkbox" class="setting-toggle h-5 w-5 accent-emerald-500" data-setting="soundEnabled" />
      </label>
      <label class="flex items-center justify-between gap-3 text-sm">
        <span>Modo daltônico</span>
        <input type="checkbox" class="setting-toggle h-5 w-5 accent-emerald-500" data-setting="colorblindMode" />
      </label>
      <label class="fullscreen-setting-row flex items-center justify-between gap-3 text-sm">
        <span>Tela cheia</span>
        <input type="checkbox" class="fullscreen-toggle h-5 w-5 accent-emerald-500" />
      </label>

      <div class="flex items-center justify-between gap-3 text-sm">
        <span class="whitespace-nowrap">Zoom câmera</span>
        <div class="camera-zoom-group flex shrink-0 overflow-hidden rounded-lg border border-white/15">
          <button type="button" class="camera-zoom-btn shrink-0 px-3 py-1 text-xs font-bold" data-zoom="1">1x</button>
          <button type="button" class="camera-zoom-btn shrink-0 border-l border-white/15 px-3 py-1 text-xs font-bold" data-zoom="2">2x</button>
        </div>
      </div>
    </div>
  </div>
</div>
