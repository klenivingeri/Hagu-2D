<div class="game-over-screen fixed inset-0 z-50 flex items-center justify-center bg-black/80 px-4 text-white">
  <div class="flex flex-col items-center gap-8">
    <div class="game-over-title flex gap-3" aria-label="Game Over">
      <span class="game-over-word flex">
        <span style="--i:0">G</span><span style="--i:1">A</span><span style="--i:2">M</span><span style="--i:3">E</span>
      </span>
      <span class="game-over-word flex">
        <span style="--i:4">O</span><span style="--i:5">V</span><span style="--i:6">E</span><span style="--i:7">R</span>
      </span>
    </div>

    <div class="game-over-actions hidden flex-col items-center gap-3">
      <button type="button" class="game-over-retry-btn rounded-full bg-emerald-500 px-10 py-3 text-sm font-extrabold uppercase tracking-wide text-gray-950 shadow-lg transition-transform active:scale-95">
        Tentar novamente
      </button>
      <button type="button" class="game-over-back-btn rounded-full border border-white/20 bg-gray-900/70 px-10 py-3 text-sm font-extrabold uppercase tracking-wide text-white shadow-lg transition-transform active:scale-95">
        Voltar pro mapa
      </button>
    </div>
  </div>
</div>
