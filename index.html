<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icons/favicon.ico" sizes="any" />
    <link rel="icon" href="./icons/favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="icon" href="./icons/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HAGU" />
    <title>HAGU</title>
    <!--
      SDK da CrazyGames — precisa carregar como script clássico (não
      type="module", não defer/async) ANTES do bundle do Vite, senão
      window.CrazyGames ainda não existiria quando CrazyGamesService.js
      chama init() no boot (ver main.js). Fora da plataforma CrazyGames
      (dev local, outro host) esta tag simplesmente falha e o service
      degrada sem quebrar o jogo (ver CrazyGamesService.js).
    -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
    <!--
      CSS crítico inline: em dev, o <script type="module"> é deferred e o
      CSS (importado dentro do JS) só é injetado depois que o módulo roda,
      então sem isso o HTML puro (com os botões do gameplay) pinta antes do
      JS decidir esconder .game-layout. Isso garante que fique escondido
      desde o primeiro paint, em dev e produção.
    -->
    <style>.game-layout { display: none; }</style>
  </head>
  <body>
    <div id="app" class="min-h-dvh w-full overflow-hidden bg-gray-950 text-white">
      <main class="game-layout">
        <div id="hud-bar" class="hud-bar" aria-hidden="true"></div>
        <section id="phaser-content" class="game-screen" aria-label="Área do jogo"></section>

        <section id="game-controls" class="controls-panel" aria-label="Controles">
          <!-- Coluna Esquerda: D-Pad -->
          <div class="control-column left-column">
            <div class="control-group dpad-container" id="dpadPad">
              <div class="dpad-center-line"></div>
              <button id="btnEsquerda" class="game-button dpad-btn" type="button" data-dir="left"><div class="game-button-visual">◀</div></button>
              <button id="btnDireita" class="game-button dpad-btn" type="button" data-dir="right"><div class="game-button-visual">▶</div></button>
            </div>
          </div>

          <!-- Coluna Direita: Ações (A e B) -->
          <div class="control-column right-column">
            <div class="control-group action-container" id="actionPad">
              <div class="action-center-line"></div>
              <button id="btnA" class="game-button action-btn" type="button"><div class="game-button-visual">A</div></button>
              <button id="btnB" class="game-button action-btn" type="button"><div class="game-button-visual">B</div></button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
