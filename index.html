<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#111827" />
    <title>Phaser + Vite + Tailwind</title>
  </head>
  <body>
    <div id="app" class="min-h-dvh w-full overflow-hidden bg-gray-950 text-white">
      <main class="game-layout">
        <section id="phaser-content" class="game-screen" aria-label="Área do jogo"></section>

        <section id="game-controls" class="controls-panel" aria-label="Controles">
          <div class="control-group">
            <button id="btnEsquerda" class="game-button" type="button">←</button>
            <button id="btnDireita" class="game-button" type="button">→</button>
          </div>
          <div class="control-group">
            <button id="btnPular" class="game-button" type="button">Pular</button>
            <button id="btnAtirar" class="game-button" type="button">Atirar</button>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
